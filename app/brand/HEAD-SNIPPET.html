<!-- Paste inside <head>. Replace YOUR-DOMAIN with the live Vercel URL. -->

<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#0e1a22">

<!-- iOS home-screen behavior -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BRP Camp">

<!-- Link preview card -->
<meta property="og:type" content="website">
<meta property="og:title" content="Blue Ridge Parkway — Moto Camping">
<meta property="og:description" content="32 campgrounds with hot showers, MP 0–469. Current closures included.">
<meta property="og:image" content="https://YOUR-DOMAIN/og-image.png">
<meta property="og:image:width" content="1200">

<meta property="og:url" content="https://YOUR-DOMAIN/">
