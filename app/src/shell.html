<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="description" content="Plan a Blue Ridge Parkway motorcycle trip: campgrounds, fuel, current closures, and Garmin-safe GPX. Works with no signal.">
<title>Blue Ridge Parkway — Moto Camping</title>

<!-- Icons. The .ico is first and unsized so old browsers stop there; modern ones prefer
     the SVG, which stays sharp at any tab size. -->
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0e1a22">

<!-- iOS home screen -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BRP Camp">
<meta name="mobile-web-app-capable" content="yes">

<!-- Link preview card. No campground count anywhere in here: the number moves every time
     a data script runs, and a card cached by iMessage or Slack does not. -->
<meta property="og:type" content="website">
<meta property="og:title" content="Blue Ridge Parkway — Moto Camping">
<meta property="og:description" content="Campgrounds, fuel and current closures, MP 0–469. Plans your riding days and exports Garmin-safe GPX.">
<meta property="og:image" content="https://brp-moto-camping.vercel.app/icons/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="https://brp-moto-camping.vercel.app/">
<meta name="twitter:card" content="summary_large_image">
<style>__LEAFLET_CSS__</style>
<style>__APP_CSS__</style>
</head>
<body>
<div id="app">
  <div id="side">
    <header>
      <span class="mark" aria-hidden="true">__MARK_SVG__</span>
      <div style="flex:1;min-width:0">
        <h1>Blue Ridge Parkway <span>Moto Camping</span></h1>
        <div class="asof" id="asof"></div>
      </div>
    </header>
    <nav class="tabs" role="tablist">
      <button data-tab="plan" role="tab" aria-selected="true">Plan</button>
      <button data-tab="browse" role="tab" aria-selected="false">Browse</button>
      <button data-tab="export" role="tab" aria-selected="false">Export</button>
      <button data-tab="notes" role="tab" aria-selected="false">Notes</button>
    </nav>
    <div class="pane" id="pane-plan" role="tabpanel"></div>
    <div class="pane" id="pane-browse" role="tabpanel" hidden></div>
    <div class="pane" id="pane-export" role="tabpanel" hidden></div>
    <div class="pane" id="pane-notes" role="tabpanel" hidden></div>
  </div>
  <div id="map"><button id="maptoggle" type="button" aria-label="Show the full map"></button></div>
</div>
<input type="file" id="importer" accept="application/json,.json" hidden>
<script>__LEAFLET_JS__</script>
<script>window.BRP_DATA=__DATA__;</script>
<script>__CORE_JS__</script>
<script>__ROUTE_JS__</script>
<script>__GPX_JS__</script>
<script>__MAPPINS_JS__</script>
<script>__APP_JS__</script>
<script>
/* Registered from the page rather than bundled, so opening index.html straight off the
   filesystem -- which is how the tests drive it -- does not throw. */
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
