<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="description" content="Blue Ridge Parkway motorcycle trip planner — campgrounds, fuel, closures, and Garmin-safe GPX export. Works offline.">
<title>Blue Ridge Parkway — Trip Planner</title>
<style>__LEAFLET_CSS__</style>
<style>__APP_CSS__</style>
</head>
<body>
<div id="app">
  <div id="side">
    <header>
      <div style="flex:1">
        <h1>Blue Ridge <span>Trip Planner</span></h1>
        <div class="asof" id="asof"></div>
      </div>
    </header>
    <nav class="tabs" role="tablist">
      <button data-tab="plan" role="tab" aria-selected="true">Plan</button>
      <button data-tab="browse" role="tab" aria-selected="false">Browse</button>
      <button data-tab="export" role="tab" aria-selected="false">Export</button>
      <button data-tab="notes" role="tab" aria-selected="false">Notes</button>
    </nav>
    <div class="pane" id="pane-plan" role="tabpanel"></div>
    <div class="pane" id="pane-browse" role="tabpanel" hidden></div>
    <div class="pane" id="pane-export" role="tabpanel" hidden></div>
    <div class="pane" id="pane-notes" role="tabpanel" hidden></div>
  </div>
  <div id="map"></div>
</div>
<input type="file" id="importer" accept="application/json,.json" hidden>
<script>__LEAFLET_JS__</script>
<script>window.BRP_DATA=__DATA__;</script>
<script>__CORE_JS__</script>
<script>__ROUTE_JS__</script>
<script>__GPX_JS__</script>
<script>__APP_JS__</script>
</body>
</html>
